name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"  # fail if uv.lock is out of date rather than silently resolving

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Postgres with pgvector, so the production store is verified in CI rather
    # than only on whichever machine last ran it by hand.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citely
          POSTGRES_PASSWORD: citely
          POSTGRES_DB: citely
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citely -d citely"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not live" --cov --cov-report=term-missing
        env:
          CITELY_TEST_PGVECTOR_DSN: postgresql://citely:citely@localhost:5432/citely

      # Offline stubs: gates the guardrails and the harness, not model quality.
      # `make eval-live` measures the real system and needs API keys.
      - name: Evaluate
        run: uv run python -m evals.run --offline

      # The hooks are part of the contributor workflow, so a broken hook config
      # should fail here rather than on someone's first commit.
      - name: Pre-commit
        run: uv run pre-commit run --all-files
