[project]
name = "citely"
version = "0.1.0"
description = "Retrieval-Augmented Generation as a Service, with grounded, cited answers and explicit guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fábio Santos", email = "ffsantos92@gmail.com" }]
keywords = ["rag", "llm", "retrieval", "citations", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.55",
    "anthropic>=0.40",
    "chromadb>=0.5",
    "pyyaml>=6.0.3",
    "psycopg[binary,pool]>=3.2",
]

[project.urls]
Homepage = "https://github.com/fabiofdsantos/citely"
Issues = "https://github.com/fabiofdsantos/citely/issues"

[project.scripts]
citely = "citely.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citely"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260815",
]

# ---------------------------------------------------------------------------
# ruff: linter + formatter (replaces flake8 + isort + black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade: modern syntax
    "B",        # bugbear: likely bugs
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "SIM",      # simplifications
    "TID",      # tidy imports
    "PTH",      # prefer pathlib over os.path
    "RUF",      # ruff-specific
    "ANN",      # require annotations
    "ASYNC",    # async antipatterns
    "S",        # bandit security checks
    "PT",       # pytest style
]
ignore = [
    "ANN401",  # allow `Any` where deliberately used
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point in tests
    "ANN201",  # test functions need no return annotation
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"  # allow `.sibling`, ban `..parent`

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy: strict from day one — cheaper than retrofitting
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "evals"]

# chromadb drags in numpy, whose bundled stubs use `type` statements that mypy
# only parses under python_version >= 3.12. We type-check against 3.11 (our
# minimum), and never touch numpy directly, so both are skipped rather than
# raising the type-checking target and losing 3.11 compatibility checks.
[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits real provider APIs; requires keys; deselected by default",
    "pgvector: needs a Postgres with pgvector; set CITELY_TEST_PGVECTOR_DSN to run",
]

[tool.coverage.run]
source = ["src/citely"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # Protocol method bodies
]
